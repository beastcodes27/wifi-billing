<!DOCTYPE html>
<html>

<head>
    <title>Inakuunganisha...</title>
    <!-- 
    HILI NI FAILI LA MIKROTIK: login.html
    MAAGIZO:
    1. Hili faili linaitwa login.html
    2. Buruta (Drag) hili faili na kuliweka kwenye Winbox -> Files -> hotspot (au Files -> flash -> hotspot)
    -->
    <meta http-equiv="refresh"
        content="0; url=https://drinkpoint.store/?mac=$(mac)&ip=$(ip)&link-login=$(link-login-only)&link-login-only=$(link-login-only)&link-orig=$(link-orig-esc)&error=$(error)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #0c0c0e;
            color: #fff;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #FF3300;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h3 style="font-weight: 700; margin-bottom: 8px;">MedBando...</h3>
    <div class="loader"></div>
    <p style="color: #94a3b8; font-size: 14px;">Tafadhali subiri kidogo.</p>

    <!-- Fallback redirect just in case meta refresh fails -->
    <script>
        setTimeout(function () {
            window.location.href = "https://drinkpoint.store/?mac=$(mac)&ip=$(ip)&link-login=$(link-login-only)&link-login-only=$(link-login-only)&link-orig=$(link-orig-esc)&error=$(error)";
        }, 1200);
    </script>
</body>

</html>
