<!DOCTYPE html>
<html>
<head>
    <title>Inaunganisha...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://drinkpoint.store/portal?mac=$(mac)&ip=$(ip)&username=$(username)&link-login=$(link-login-only)">
    <script>
        setTimeout(function() {
            window.location.href = "https://drinkpoint.store/portal?mac=$(mac)&ip=$(ip)&username=$(username)&link-login=$(link-login-only)";
        }, 500);
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; text-align: center; }
        a { text-decoration: none; display: block; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #333; }
        .loader { border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #3b82f6; color: white; padding: 10px 20px; border-radius: 5px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="https://drinkpoint.store/portal?mac=$(mac)&ip=$(ip)&username=$(username)&link-login=$(link-login-only)">
        <div class="loader"></div>
        <h2>Tafadhali Subiri...</h2>
        <p>Kama haijafunguka, <strong>Bofya Hapa</strong></p>
    </a>
</body>
</html>
